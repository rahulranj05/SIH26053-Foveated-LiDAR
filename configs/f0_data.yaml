version: 1

seed: 42

ontology:
  path: configs/ontology.yaml
  num_classes: 23
  ignore_index: 0

mappings:
  semantic_kitti: datasets/mappings/semantic_kitti.yaml
  rellis_3d: datasets/mappings/rellis.yaml
  semantic_stf: datasets/mappings/semantic_stf.yaml
  nuscenes_mini: datasets/mappings/nuscenes.yaml

# ============================================================
# DATASET ROOTS
# ============================================================
# Actual roots are resolved automatically by datasets/paths.py.
#
# Google Drive top-level names:
#
# SemanticKITTI/
# RELLIS_3D/
# SemanticSTF/
# nuScenes/
# IITH/
#
# IIT-H is NOT part of F0 semantic training.

# ============================================================
# TRAIN / VALIDATION / TEST POLICY
# ============================================================

splits:
  semantic_kitti:
    # Standard supervised SemanticKITTI setup.
    train_sequences:
      - "00"
      - "01"
      - "02"
      - "03"
      - "04"
      - "05"
      - "06"
      - "07"
      - "09"
      - "10"

    val_sequences:
      - "08"

    # Official sequences 11-21 are unlabeled.
    # Therefore they are not used for supervised F0 test metrics.
    test_sequences: []

  semantic_stf:
    # Use the dataset's official split directories.
    train_split: train
    val_split: val
    test_split: test

  rellis_3d:
    # Use the official RELLIS split-list files:
    # pt_train.lst
    # pt_val.lst
    # pt_test.lst
    #
    # Frame identity must be:
    # (sequence, frame_id)
    use_official_lists: true

  nuscenes_mini:
    # nuScenes-mini uses a permanently frozen scene-level split.
    #
    # We do NOT recalculate 70/15/15 every run.
    # The exact 7 train / 2 val / 1 test scene tokens are stored
    # in the file below.
    split_level: scene
    split_file: configs/nuscenes_mini_split_v1.yaml

# ============================================================
# MULTI-DATASET TRAINING MIXTURE
# ============================================================
#
# Reduced oversampling of the smaller SemanticSTF and
# nuScenes-mini datasets.
#
# ExactMixtureSampler uses these as per-epoch target ratios.

sampling:
  semantic_kitti: 0.50
  rellis_3d: 0.35
  semantic_stf: 0.13
  nuscenes_mini: 0.02

# ============================================================
# CLASS DISTRIBUTION SCAN
# ============================================================
#
# This section is for data-distribution inspection only.
#
# IMPORTANT:
# Training class weights are NOT authoritative here.
# Final training weights are generated separately from the
# exact TRAIN distribution using:
#
# scripts/compute_f0_class_weights.py
#
# Authoritative files:
#
# /content/drive/MyDrive/SIH26053/f0_tar_cache/
#     f0_class_distribution_exact.json
#     f0_class_weights_exact.json
#
# Validation/test data must never contribute to class weights.

distribution:
  # exact:
  #   reads every TRAIN label file.
  #
  # sampled:
  #   only for quick diagnostics/debugging.
  mode: exact

  sampled_frames_per_dataset: 300

# ============================================================
# OUTPUT
# ============================================================

output:
  colab_directory: /content/drive/MyDrive/SIH26053/f0_preparation
  local_directory: outputs/f0_preparation

  manifest_filename: f0_data_manifest.json
  distribution_filename: f0_class_distribution.json